<div class="modal-container">


    <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span class="header-icon">🔗</span>
            <h3>Compartir Mural</h3>
        </div>
        <span class="close-modal-x" (click)="onClose.emit()">×</span>
    </div>

    <div class="modal-body">

        <div class="form-group">
            <label class="form-label">Enlace de compartición</label>
            <div class="link-row">
                <input type="text" class="form-input" [value]="shareLink" readonly>
                <button class="btn-copy" (click)="copyLink()">
                    <span class="copy-icon">📋</span>
                    Copiar
                </button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Usuarios compartidos ({{ participantes.length }})</label>
            <div class="users-list">

                <div *ngFor="let p of participantes" class="user-item">
                    <span class="user-avatar">👤</span>
                    <div class="user-info">
                        <span class="user-email">{{ getMemberName(p.usuario_id) }}</span>
                        <span class="user-role">{{ p.permiso }}</span>
                    </div>
                    <span class="remove-user-btn" (click)="remove(p.usuario_id?._id || p.usuario_id)">×</span>
                </div>

            </div>
        </div>

        <div class="form-group" style="margin-top: 5px;">
            <label class="form-label">Añadir nuevo usuario</label>
            <div class="invite-row">
                <input type="text" class="form-input" placeholder="Email del usuario..." [(ngModel)]="newEmail"
                    (keyup.enter)="invite()">
                <button class="btn-invite-submit" (click)="invite()">
                    Añadir
                </button>
            </div>
        </div>

    </div>
</div>
