<div class="modal-container">


    <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span class="header-icon">🔗</span>
            <h3>Compartir Mural</h3>
        </div>
        <span class="close-modal-x" (click)="onClose.emit()">×</span>
    </div>

    <div class="modal-body">

        <div class="form-group role-selection-section">
            <label class="form-label">Permisos del enlace compartido</label>
            <div class="role-cards-container">
                <div class="role-card" [class.active]="roleParaLink === 'lector'" (click)="roleParaLink = 'lector'">
                    <div class="role-card-indicator" *ngIf="roleParaLink === 'lector'">✓</div>
                    <div class="role-card-icon">👁️</div>
                    <div class="role-card-info">
                        <span class="role-card-title">Lector</span>
                        <span class="role-card-desc">Solo ver y comentar</span>
                    </div>
                </div>

                <div class="role-card" [class.active]="roleParaLink === 'editor'" (click)="roleParaLink = 'editor'">
                    <div class="role-card-indicator" *ngIf="roleParaLink === 'editor'">✓</div>
                    <div class="role-card-icon">✏️</div>
                    <div class="role-card-info">
                        <span class="role-card-title">Editor</span>
                        <span class="role-card-desc">Crear y editar posits</span>
                    </div>
                </div>
            </div>

            <label class="form-label" style="margin-top: 15px;">Enlace de invitación</label>
            <div class="link-row-premium">
                <input type="text" class="form-input-share" [value]="shareLink" readonly>
                <button class="btn-copy-premium" (click)="copyLink()">
                    <span class="copy-icon">📋</span>
                    Copiar
                </button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Usuarios compartidos ({{ participantes.length }})</label>
            <div class="users-list">

                <div *ngFor="let p of participantes" class="user-item">
                    <span class="user-avatar">👤</span>
                    <div class="user-info">
                        <span class="user-email">{{ getMemberName(p) }}</span>
                        <!-- Dropdown de rol solo si soy Admin -->
                        <select *ngIf="userRole === 'admin'" class="user-role-select" [ngModel]="p.permiso"
                            (ngModelChange)="onRoleChange.emit({ userId: p.usuario_id?._id || p.usuario_id || p.guest_id, role: $event })">
                            <option value="lector">lector</option>
                            <option value="editor">editor</option>
                            <option value="admin">admin</option>
                        </select>
                        <span *ngIf="userRole !== 'admin'" class="user-role">{{ p.permiso }}</span>
                    </div>
                    <span class="remove-user-btn"
                        (click)="remove(p.usuario_id?._id || p.usuario_id || p.guest_id)">×</span>
                </div>

            </div>
        </div>

        <div *ngIf="userRole === 'admin'" class="form-group" style="margin-top: 5px;">
            <label class="form-label">Añadir nuevo usuario</label>
            <div class="invite-row-container">
                <div class="invite-row">
                    <input type="text" class="form-input" placeholder="Email del usuario..." [(ngModel)]="newEmail"
                        (keyup.enter)="invite()">
                    <select class="form-select-role" [(ngModel)]="selectedPermiso">
                        <option value="lector">Lector</option>
                        <option value="editor">Editor</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button class="btn-invite-submit full-width" (click)="invite()">
                    Añadir al equipo
                </button>
            </div>
        </div>

    </div>
</div>
